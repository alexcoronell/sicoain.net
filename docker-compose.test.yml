# ============================================
# DOCKER COMPOSE - SICOAIN
# ============================================
# Infrastructure services for local development
# Includes SQL Server Developer, optionally Azure Data Studio / SQL Server tools
#
# Author: SICOAIN Team
# Date: 2026-05-29
# Version: 1.0.0

services:
  sqlserver-tests:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sicoain-sqlserver-tests
    environment:
      ACCEPT_EULA: 'Y'
      SA_PASSWORD: '51c04in!2024'
      MSSQL_PID: 'Developer'
      MSSQL_AGENT_ENABLED: 'true'
    ports:
      - '1434:1433'
    volumes:
      - sqlserver_tests_data:/var/opt/mssql
    networks:
      - sicoain-network
    healthcheck:
      test: ["CMD", "/opt/mssql-tools/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "51c04in!2024", "-d", "master", "-Q", "SELECT 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

# ============================================
# VOLUMES - Persistent Storage
# ============================================
volumes:
  sqlserver_tests_data:
    driver: local
    name: sicoain-sqlserver-tests-data

# ============================================
# NETWORKS
# ============================================
networks:
  sicoain-network:
    driver: bridge
    name: sicoain-sqlserver-tests-data-network
